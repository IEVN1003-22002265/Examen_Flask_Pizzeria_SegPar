<div class="max-w-4xl mx-auto my-8 p-6 bg-slate-100 rounded-3xl shadow-xl">
    <div class="mb-6 p-5 bg-white rounded-2xl shadow-sm flex justify-between items-center">
        <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight flex items-center gap-2.5">
            <span class="w-2.5 h-6 bg-blue-600 rounded-full inline-block shadow-sm"></span>
            Registrar Pedido
        </h1>
    </div>

    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()" class="space-y-6">
        

        <div class="bg-white p-6 rounded-2xl shadow-sm space-y-4">
            <h2 class="text-lg font-bold text-slate-800 border-b pb-2">1. Datos del Cliente</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Nombre Completo:</label>
                    <input formControlName="nombreCompleto" type="text" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ingresar nombre completo">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Teléfono:</label>
                    <input formControlName="telefono" type="text" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ingresar número de telefono">
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Dirección:</label>
                    <input formControlName="direccion" type="text" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ingresar dirección">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Fecha de Compra:</label>
                    <input formControlName="fechaCompra" type="date" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>
        </div>


        <div class="bg-white p-6 rounded-2xl shadow-sm space-y-4">
            <h2 class="text-lg font-bold text-slate-800 border-b pb-2">2.Pizza</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
             
                <div class="space-y-2 p-4 bg-slate-50 rounded-xl border border-slate-200">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Tamaño de Pizza:</label>
                    <div class="space-y-2">
                        <label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
                            <input type="radio" formControlName="tamano" value="Chica" (change)="calcularTotal()" class="text-blue-600 focus:ring-blue-500">
                            Chica ($40)
                        </label>
                        <label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
                            <input type="radio" formControlName="tamano" value="Mediana" (change)="calcularTotal()" class="text-blue-600 focus:ring-blue-500">
                            Mediana ($80)
                        </label>
                        <label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
                            <input type="radio" formControlName="tamano" value="Grande" (change)="calcularTotal()" class="text-blue-600 focus:ring-blue-500">
                            Grande ($120)
                        </label>
                    </div>
                </div>


                <div class="space-y-2 p-4 bg-slate-50 rounded-xl border border-slate-200">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Ingredientes:</label>
                    <div class="space-y-2" [formGroup]="ingredientesGroup">
                        <label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
                            <input type="checkbox" formControlName="jamon" class="rounded text-blue-600 focus:ring-blue-500">
                            Jamón
                        </label>
                        <label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
                            <input type="checkbox" formControlName="pina" class="rounded text-blue-600 focus:ring-blue-500">
                            Piña
                        </label>
                        <label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
                            <input type="checkbox" formControlName="champiñones" class="rounded text-blue-600 focus:ring-blue-500">
                            Champiñones
                        </label>
                    </div>
                </div>
            </div>


            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Número de Pizzas:</label>
                    <input formControlName="numPizzas" type="number" min="1" (input)="calcularTotal()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Total a Pagar ($):</label>
                    <input formControlName="totalPedido" type="number" readonly class="w-full bg-slate-200 border border-slate-300 rounded-xl p-3 text-sm font-bold text-blue-700 cursor-not-allowed">
                </div>
            </div>
        </div>

        <button type="submit" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-2xl shadow-lg shadow-blue-600/30 transition-all cursor-pointer text-base">
            Guardar Pedido en Base de Datos
        </button>
    </form>
</div>
